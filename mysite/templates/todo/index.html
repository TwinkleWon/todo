                                <input type="text" class="form-control" placeholder="할일 입력" name="todo_text" id="todo_list">

                            <button type="button" class="btn btn-primary btn-am" id="btnCreate">등록</button>
                         </div>
                    </form>
                </li>
                <li class="list-group-item">
                    <div class="d-flex">
                        <div class="me-auto">
                            <a href="{% url 'todo:detail' todo.id %}">

                            </a>
                        </div>

    </div>
