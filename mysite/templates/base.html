<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>할일</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <style>
            body {
                margin: 0;
                font-family: 'Nanum Myeongjo', serif;
                background-image: url('https://cdn.pixabay.com/photo/2020/07/26/14/43/cherry-blossom-5439750_960_720.png'); /* 배경 이미지 URL */
                background-size: cover; /* 배경 이미지가 화면 전체를 덮도록 설정 */
                background-position: center; /* 배경 이미지의 위치를 중앙으로 설정 */
                background-repeat: no-repeat; /* 배경 이미지 반복 방지 */
                background-attachment: fixed; /* 배경 이미지를 고정하여 스크롤 시에도 배경이 움직이지 않도록 설정 */
            }
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 30px;
            }
            .card {
                background: rgba(255, 255, 255, 0.9); /* 카드 배경에 반투명 흰색을 추가하여 배경 이미지와 대비 */
                border: 1px solid #e29c8f;
                border-radius: 15px;
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 600px;
                padding: 20px;
                margin-top: 30px;
                margin-bottom: 20px;
                position: relative;
            }
            .card-header {
                background-color: #f76c6c;
                color: white;
                border-bottom: 2px solid #e29c8f;
                font-family: 'Nanum Myeongjo', serif;
                text-align: center;
                padding: 10px;
                border-radius: 10px 10px 0 0;
            }
            .list-group-item {
                background-color: #ffffff;
                border: 1px solid #e29c8f;
                border-radius: 5px;
            }
            .btn-primary {
                background-color: #b74e34;
                border-color: #b74e34;
            }
            .btn-warning {
                background-color: #d99d70;
                border-color: #d99d70;
            }
            .btn-danger {
                background-color: #b74e34;
                border-color: #b74e34;
            }
            .span-todo-text a {
                color: #b74e34;
                text-decoration: none;
            }
            .span-todo-text a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
                {% block content %}
                {% endblock %}
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        {% block script %}
        {% endblock %}
    </body>
</html>
